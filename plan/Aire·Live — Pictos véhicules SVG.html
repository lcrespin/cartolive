<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aire·Live — Pictos véhicules</title>
<style>
  body {
    background: #0a0e14;
    font-family: 'Inter', sans-serif;
    color: #e4e8ed;
    padding: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
  }
  .card {
    background: #10151e;
    border: 1px solid #ffffff14;
    border-radius: 14px;
    padding: 24px;
    width: 160px;
    text-align: center;
  }
  .card svg { width: 48px; height: 48px; margin-bottom: 10px; }
  .card .label { font-size: 12px; color: #8b95a5; }
  .plane { color: #3ed9c4; }
  .train { color: #6fb8f0; }
  .boat  { color: #c792ea; }
  .bus   { color: #f2a65a; }
  .sat   { color: #f0e15a; }

  /* démonstration de rotation dynamique pour avion/bateau */
  .rotate-demo { transform: rotate(37deg); }
</style>
</head>
<body>

<!-- AVION — triangle allongé pointant vers le haut par défaut, à faire pivoter selon le heading -->
<div class="card">
  <svg class="plane" viewBox="0 0 32 32" fill="currentColor">
    <path d="M16 1
             C16.8 1 17.4 1.6 17.6 2.5
             L19 11
             L28.5 17
             C29.3 17.5 29.8 18.3 29.8 19.2
             L29.8 20.8
             C29.8 21.4 29.3 21.7 28.7 21.5
             L18.5 18.3
             L17.6 24.5
             L21 27.3
             C21.5 27.7 21.7 28.2 21.7 28.8
             L21.7 29.6
             C21.7 30 21.3 30.3 20.9 30.1
             L16 28.2
             L11.1 30.1
             C10.7 30.3 10.3 30 10.3 29.6
             L10.3 28.8
             C10.3 28.2 10.5 27.7 11 27.3
             L14.4 24.5
             L13.5 18.3
             L3.3 21.5
             C2.7 21.7 2.2 21.4 2.2 20.8
             L2.2 19.2
             C2.2 18.3 2.7 17.5 3.5 17
             L13 11
             L14.4 2.5
             C14.6 1.6 15.2 1 16 1 Z"/>
  </svg>
  <div class="label">Avion</div>
</div>

<!-- TRAIN — vue de dessus, wagon simplifié -->
<div class="card">
  <svg class="train" viewBox="0 0 32 32" fill="currentColor">
    <rect x="7" y="3" width="18" height="26" rx="5"/>
    <rect x="10.5" y="7.5" width="5" height="7" rx="1" fill="#0a0e14"/>
    <rect x="16.5" y="7.5" width="5" height="7" rx="1" fill="#0a0e14"/>
    <rect x="9" y="18" width="14" height="2.4" rx="1.2" fill="#0a0e14"/>
    <circle cx="11.5" cy="26" r="1.6" fill="#0a0e14"/>
    <circle cx="20.5" cy="26" r="1.6" fill="#0a0e14"/>
  </svg>
  <div class="label">Train</div>
</div>

<!-- BATEAU — coque simplifiée vue de dessus, pointant vers le haut par défaut -->
<div class="card">
  <svg class="boat" viewBox="0 0 32 32" fill="currentColor">
    <path d="M16 2 C17 2 17.7 2.7 18 3.8 L20.5 14 L20.5 14 L16 14 L11.5 14 L14 3.8 C14.3 2.7 15 2 16 2 Z"/>
    <path d="M6 15 L26 15 C27 15 27.5 15.7 27.1 16.6 L23.5 25.5 C22.9 27 21.6 28 20 28 L12 28 C10.4 28 9.1 27 8.5 25.5 L4.9 16.6 C4.5 15.7 5 15 6 15 Z"/>
  </svg>
  <div class="label">Bateau</div>
</div>

<!-- BUS — vue de dessus, rectangle arrondi avec fenêtres -->
<div class="card">
  <svg class="bus" viewBox="0 0 32 32" fill="currentColor">
    <rect x="6" y="4" width="20" height="24" rx="4"/>
    <rect x="9" y="7.5" width="4.2" height="5" rx="1" fill="#0a0e14"/>
    <rect x="13.9" y="7.5" width="4.2" height="5" rx="1" fill="#0a0e14"/>
    <rect x="18.8" y="7.5" width="4.2" height="5" rx="1" fill="#0a0e14"/>
    <rect x="9" y="15.5" width="14" height="7.5" rx="1.5" fill="#0a0e14"/>
    <circle cx="11" cy="27" r="1.7" fill="#0a0e14"/>
    <circle cx="21" cy="27" r="1.7" fill="#0a0e14"/>
  </svg>
  <div class="label">Bus / métro</div>
</div>

<!-- SATELLITE — corps + deux panneaux solaires -->
<div class="card">
  <svg class="sat" viewBox="0 0 32 32" fill="currentColor">
    <rect x="12.5" y="12.5" width="7" height="7" rx="1.5"/>
    <rect x="1" y="10.5" width="9" height="11" rx="1.2"/>
    <rect x="22" y="10.5" width="9" height="11" rx="1.2"/>
    <rect x="10" y="15" width="2.5" height="2" fill="currentColor"/>
    <rect x="19.5" y="15" width="2.5" height="2" fill="currentColor"/>
    <line x1="16" y1="12.5" x2="16" y2="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="16" cy="5" r="1.4"/>
  </svg>
  <div class="label">Satellite</div>
</div>

<!-- Démo de rotation dynamique (avion à 37°) -->
<div class="card">
  <svg class="plane rotate-demo" viewBox="0 0 32 32" fill="currentColor">
    <path d="M16 1
             C16.8 1 17.4 1.6 17.6 2.5
             L19 11
             L28.5 17
             C29.3 17.5 29.8 18.3 29.8 19.2
             L29.8 20.8
             C29.8 21.4 29.3 21.7 28.7 21.5
             L18.5 18.3
             L17.6 24.5
             L21 27.3
             C21.5 27.7 21.7 28.2 21.7 28.8
             L21.7 29.6
             C21.7 30 21.3 30.3 20.9 30.1
             L16 28.2
             L11.1 30.1
             C10.7 30.3 10.3 30 10.3 29.6
             L10.3 28.8
             C10.3 28.2 10.5 27.7 11 27.3
             L14.4 24.5
             L13.5 18.3
             L3.3 21.5
             C2.7 21.7 2.2 21.4 2.2 20.8
             L2.2 19.2
             C2.2 18.3 2.7 17.5 3.5 17
             L13 11
             L14.4 2.5
             C14.6 1.6 15.2 1 16 1 Z"/>
  </svg>
  <div class="label">Avion (cap 37°)</div>
</div>

</body>
</html>
